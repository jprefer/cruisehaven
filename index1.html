<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruise Travel Agency</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f8ff;
            text-align: center;
        }
        .hero {
            background: url('/cruise-hero.jpg') center/cover no-repeat;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        .hero h1 {
            font-size: 3rem;
        }
        .destinations, .contact {
            padding: 50px 20px;
        }
        .destinations h2, .contact h2 {
            font-size: 2rem;
        }
        .destination-list {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .destination {
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        .destination img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .contact button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1>Explore the Seas with Luxury Cruises</h1>
    </section>
    
    <section class="destinations">
        <h2>Top Destinations</h2>
        <div class="destination-list">
            <div class="destination">
                <img src="/caribbean.jpg" alt="Caribbean">
                <p>Caribbean</p>
            </div>
            <div class="destination">
                <img src="/mediterranean.jpg" alt="Mediterranean">
                <p>Mediterranean</p>
            </div>
            <div class="destination">
                <img src="/alaska.jpg" alt="Alaska">
                <p>Alaska</p>
            </div>
        </div>
    </section>

    <section class="contact">
        <h2>Get in Touch</h2>
        <p>Book your dream cruise today!</p>
        <button>Contact Us</button>
    </section>
</body>
</html>
